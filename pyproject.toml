[project]
name = "chhaya"
version = "0.1.0"
description = "Chhaya: a Type 2 diabetes digital twin that keeps working after the glucose sensor comes off"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "jax>=0.4.35",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "plotly>=5.24",
    "streamlit>=1.40",
    "requests>=2.32",
    "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chhaya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: fits a twin (seconds each)", "data: needs downloaded datasets"]
addopts = "-m 'not data'"
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the formatter owns line length. B008: Fixed() and SlowCoef() defaults are immutable NamedTuples.
ignore = ["E501", "B008"]
