<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chhaya</title>
<link rel="preload" href="fonts/SourceSans3VF-Upright.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/SourceSerif4VF-Roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></symbol>
  <symbol id="i-theme" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.6M8 5.1v.1"/></symbol>
  <symbol id="i-flag" viewBox="0 0 16 16"><path d="M3.5 14V2.5M3.5 3h8l-1.8 2.8L11.5 8.5h-8"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5.5 8h5"/></symbol>
  <symbol id="i-slash" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M3.8 12.2 12.2 3.8"/></symbol>
  <symbol id="i-delta" viewBox="0 0 16 16"><path d="M8 3 13.5 12.5h-11z"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-span" viewBox="0 0 16 16"><path d="M2.5 5v6M13.5 5v6M2.5 8h11"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M9.5 3.5 5 8l4.5 4.5"/></symbol>
  <symbol id="i-sort" viewBox="0 0 10 14"><path d="M5 12V2M1.5 5.5 5 2l3.5 3.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></symbol>
</svg>

<a class="skip" href="#main">Skip to content</a>

<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#clinic" aria-label="Chhaya, clinic list">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle class="b-shadow" cx="15.5" cy="15.5" r="8.5"/><circle class="b-ink" cx="10.5" cy="10.5" r="8.5"/></svg>
      Chhaya
    </a>
    <nav class="tabs" aria-label="Screens">
      <a href="#clinic" data-view="clinic">Clinic list</a>
      <a href="#patient" data-view="patient">Patient</a>
      <a href="#evidence" data-view="evidence">Evidence</a>
    </nav>
    <div class="top-tools">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch between light and dark"><svg class="ic"><use href="#i-theme"/></svg></button>
    </div>
  </div>
  <div class="limits" role="note" aria-label="Limits of this prototype">
    <p><svg class="ic"><use href="#i-info"/></svg><span id="limits">Research prototype; evaluated on a Chinese cohort in supervised care and a US free-living cohort; estimates, not measurements; not for dosing.</span></p>
  </div>
</header>

<main id="main">
  <section class="view" id="view-clinic" aria-label="Clinic list"><p class="lede">Loading the bundle.</p></section>
  <section class="view" id="view-patient" aria-label="Patient" hidden></section>
  <section class="view" id="view-evidence" aria-label="Evidence" hidden></section>
</main>

<footer class="foot" id="foot">Chhaya · SynapseX, IIT Kanpur</footer>

<script src="app.js"></script>
</body>
</html>
