<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chhaya — Phase 1 Video Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050a18;--bg2:#0a1128;--card:#0f172a;--card2:#1e293b;
  --border:#1e293b;--border2:#334155;
  --violet:#a78bfa;--violet-bright:#c4b5fd;--violet-dark:#7c3aed;
  --teal:#22d3ee;--teal-dark:#06b6d4;
  --amber:#fbbf24;--amber-dark:#f59e0b;
  --green:#34d399;--green-dark:#10b981;
  --red:#f87171;
  --white:#f1f5f9;--white2:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:var(--font)}

/* ═══ BACKGROUND GRID + GLOW ═══ */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,58,237,.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,.08) 0%, transparent 50%),
    linear-gradient(rgba(15,23,42,.4) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,.4) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
  pointer-events:none;
}

/* ═══ LAYOUT ═══ */
.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 32px;overflow:hidden}
.slide{
  width:100%;max-width:1440px;aspect-ratio:16/9;position:relative;
  border-radius:16px;overflow:hidden;
  background:var(--bg2);
  border:1px solid var(--border);
  box-shadow:0 0 80px rgba(124,58,237,.08),0 25px 60px rgba(0,0,0,.5);
}

/* ═══ SLIDE INNER LAYOUT ═══ */
.slide-inner{
  position:absolute;inset:0;padding:48px 56px 40px;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(12px);
  animation:slideIn .5s ease forwards;
}
@keyframes slideIn{to{opacity:1;transform:translateY(0)}}

/* ═══ SECTION TAG ═══ */
.sec-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--teal);margin-bottom:10px;
}
.sec-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sec-tag .num{
  background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.2);
  padding:2px 8px;border-radius:4px;font-size:10px;color:var(--teal);
}

/* ═══ TITLE ═══ */
.s-title{
  font-size:clamp(24px,3vw,36px);font-weight:800;line-height:1.2;letter-spacing:-.02em;
  color:var(--white);margin-bottom:4px;
}
.accent-line{
  height:3px;width:80px;border-radius:2px;margin:12px 0 20px;
  background:linear-gradient(90deg,var(--violet),var(--teal));
}

/* ═══ BODY ═══ */
.s-body{flex:1;display:grid;gap:20px;align-content:start;overflow:hidden}
.s-body.cols-2{grid-template-columns:1fr 1fr}
.s-body.cols-2-wide{grid-template-columns:1.2fr .8fr}
.s-body.cols-img{grid-template-columns:1fr 1fr;align-items:center}

/* ═══ GLASS CARD ═══ */
.glass{
  background:rgba(15,23,42,.7);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(148,163,184,.1);
  border-radius:12px;padding:24px 28px;
  position:relative;overflow:hidden;
}
.glass::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.3),transparent);
}
.glass.teal::before{background:linear-gradient(90deg,transparent,rgba(34,211,238,.3),transparent)}
.glass.amber::before{background:linear-gradient(90deg,transparent,rgba(251,191,36,.3),transparent)}
.glass.green::before{background:linear-gradient(90deg,transparent,rgba(52,211,153,.3),transparent)}

/* ═══ TYPOGRAPHY INSIDE CARDS ═══ */
.glass h3{
  font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.glass h3 .icon{font-size:18px}
.glass ul{list-style:none;padding:0}
.glass li{
  position:relative;padding-left:20px;margin-bottom:10px;
  font-size:15px;line-height:1.55;color:var(--white2);
}
.glass li::before{
  content:'';position:absolute;left:0;top:8px;
  width:6px;height:6px;border-radius:50%;
  background:var(--violet);
}
.glass li strong{color:var(--white);font-weight:700}
.glass li em{color:var(--amber);font-style:normal;font-weight:600}

/* ═══ METRIC CARDS ═══ */
.metric-row{display:flex;gap:16px;flex-wrap:wrap}
.metric{
  background:rgba(15,23,42,.8);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;flex:1;min-width:140px;text-align:center;
}
.metric .val{
  font-size:28px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--violet-bright),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.metric .lbl{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}

/* ═══ BADGE / TAG ═══ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.04em;
}
.badge.pass{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:var(--green)}
.badge.miss{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--amber)}
.badge.info{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.2);color:var(--teal)}

/* ═══ CODE BLOCK ═══ */
.code{
  background:#0c1222;border:1px solid var(--border);border-radius:8px;
  padding:16px 20px;font-family:var(--mono);font-size:13px;line-height:1.7;
  color:var(--teal);overflow-x:auto;white-space:pre;
}
.code .comment{color:var(--dim)}
.code .cmd{color:var(--green)}
.code .flag{color:var(--amber)}

/* ═══ QUOTE ═══ */
.quote{
  border-left:3px solid var(--violet);padding:16px 24px;
  background:rgba(124,58,237,.06);border-radius:0 8px 8px 0;
  font-size:18px;line-height:1.6;color:var(--violet-bright);font-weight:500;
  font-style:italic;
}

/* ═══ IMG FRAME ═══ */
.img-frame{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.img-frame img{width:100%;border-radius:8px;display:block}

/* ═══ TABLE ═══ */
.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.data-table th{
  background:rgba(34,211,238,.08);color:var(--teal);font-weight:700;
  padding:10px 14px;text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
.data-table td{padding:10px 14px;border-bottom:1px solid rgba(30,41,59,.5);color:var(--white2)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(124,58,237,.04)}

/* ═══ PROGRESS BAR (animated) ═══ */
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:120px;font-size:13px;color:var(--muted);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:rgba(15,23,42,.6);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--white)}

/* ═══ HERO TITLE SLIDE ═══ */
.hero{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:64px 72px;
  background:
    radial-gradient(ellipse 70% 60% at 30% 40%, rgba(124,58,237,.15) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 70% 70%, rgba(6,182,212,.1) 0%, transparent 50%),
    var(--bg2);
  animation:slideIn .6s ease forwards;
}
.hero .tag{
  font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--teal);margin-bottom:20px;
  display:flex;align-items:center;gap:8px;
}
.hero .tag::before{content:'';width:24px;height:2px;background:var(--teal);border-radius:1px}
.hero h1{
  font-size:clamp(48px,6vw,72px);font-weight:900;letter-spacing:-.03em;line-height:1.05;
  background:linear-gradient(135deg,var(--white) 0%,var(--violet-bright) 50%,var(--teal) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;
}
.hero .sub{font-size:clamp(20px,2.5vw,28px);color:var(--violet-bright);font-weight:600;margin-bottom:16px}
.hero .desc{font-size:17px;color:var(--muted);line-height:1.6;max-width:750px;margin-bottom:28px}
.hero .team{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.hero .team .chip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(15,23,42,.7);border:1px solid var(--border2);
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--white2);
}
.hero .team .chip .ic{font-size:16px}

/* ═══ SUBTITLE BAR ═══ */
.sub-bar{
  background:rgba(10,17,40,.95);border-top:1px solid var(--border);
  padding:14px 32px;display:flex;align-items:center;gap:16px;
  min-height:56px;
}
.sub-bar .indicator{
  width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;
  animation:pulse 1.5s infinite;
}
.sub-bar .indicator.paused{background:var(--amber);animation:none}
.sub-bar .text{
  flex:1;font-size:14px;line-height:1.5;color:var(--white2);
  max-height:40px;overflow:hidden;
}

/* ═══ CONTROL BAR ═══ */
.ctrl{
  background:rgba(5,10,24,.95);border-top:1px solid var(--border);
  padding:10px 24px;display:flex;align-items:center;gap:12px;
}
.ctrl-left,.ctrl-right{display:flex;align-items:center;gap:8px}
.ctrl-center{flex:1;display:flex;align-items:center;gap:12px;justify-content:center;max-width:600px;margin:0 auto}
.btn{
  background:var(--card);border:1px solid var(--border);color:var(--white);
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;transition:all .2s;font-family:var(--font);
}
.btn:hover{background:var(--card2);border-color:var(--violet)}
.btn.primary{background:var(--violet-dark);border-color:var(--violet-dark);color:#fff}
.btn.primary:hover{background:#6d28d9}
.btn.active{background:rgba(34,211,238,.15);border-color:var(--teal-dark);color:var(--teal)}

.progress{flex:1;height:4px;background:var(--card);border-radius:2px;overflow:hidden;cursor:pointer;position:relative}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));width:0%;transition:width .3s}
.time{font-size:12px;color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ═══ SLIDE DRAWER ═══ */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--bg);
  border-left:1px solid var(--border);z-index:201;
  transform:translateX(100%);transition:transform .3s ease;
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{font-size:16px;font-weight:700;color:var(--white)}
.drawer-body{flex:1;overflow-y:auto;padding:12px}
.drawer-item{
  padding:10px 14px;border-radius:8px;margin-bottom:4px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid transparent;transition:all .15s;
}
.drawer-item:hover{background:var(--card);border-color:var(--border)}
.drawer-item.active{background:rgba(124,58,237,.08);border-color:var(--violet-dark)}
.drawer-item .idx{
  font-size:11px;font-weight:700;color:var(--dim);
  background:var(--card);border-radius:4px;padding:2px 6px;flex-shrink:0;margin-top:2px;
}
.drawer-item .idx.active{color:var(--violet);background:rgba(124,58,237,.15)}
.drawer-item .ttl{font-size:13px;line-height:1.4;color:var(--muted)}
.drawer-item.active .ttl{color:var(--white);font-weight:600}

/* ═══ CLOSING SLIDE ═══ */
.closing{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:64px;
  background:
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(124,58,237,.12) 0%, transparent 60%),
    var(--bg2);
  animation:slideIn .6s ease forwards;
}
.closing h1{
  font-size:48px;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--white),var(--violet-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:16px;
}
.closing .sub{font-size:20px;color:var(--muted);max-width:700px;line-height:1.6;margin-bottom:32px}
.closing .team-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="app">
  <div class="stage"><div class="slide" id="slide"></div></div>
  <div class="sub-bar">
    <div class="indicator" id="indicator"></div>
    <div class="text" id="sub-text">Press ▶ Play to begin the narrated presentation.</div>
  </div>
  <div class="ctrl">
    <div class="ctrl-left">
      <button class="btn primary" id="btn-play" title="Play / Pause">▶ Play</button>
      <button class="btn" id="btn-prev" title="Previous slide">⏮</button>
      <button class="btn" id="btn-next" title="Next slide">⏭</button>
    </div>
    <div class="ctrl-center">
      <span class="time" id="t-cur">00:00</span>
      <div class="progress" id="track"><div class="fill" id="fill"></div></div>
      <span class="time" id="t-tot">~25:00</span>
    </div>
    <div class="ctrl-right">
      <button class="btn" id="btn-voice" title="Toggle voice narration">🔊 Voice</button>
      <button class="btn" id="btn-speed">1×</button>
      <button class="btn" id="btn-list" title="View all slides">☰ Slides</button>
      <a href="Chhaya_Phase1_Presentation.pptx" download class="btn" style="text-decoration:none" title="Download PowerPoint file">⬇ PPTX</a>
      <button class="btn" id="btn-fs" title="Toggle fullscreen">⛶</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h3>All Slides</h3><button class="btn" id="btn-close">✕</button></div>
  <div class="drawer-body" id="drawer-list"></div>
</div>

<script>
(()=>{
'use strict';
let slides=[],cur=0,playing=false,voice=true,speed=1,synth=speechSynthesis,utt=null,timer=null,elapsed=0,clock=null;
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);

const IMG_MAP={37:'img/dashboard-patient.png',38:'img/dashboard-patient.png',47:'img/dashboard-patient.png',48:'img/dashboard-patient.png',26:'img/dashboard-evidence.png',46:'img/dashboard-evidence.png',27:'img/gate2-by-group.png',51:'img/gate2-by-group.png'};

fetch('slides.json').then(r=>r.json()).then(d=>{slides=d;buildDrawer();render(0)}).catch(e=>{$('slide').innerHTML=`<div class="slide-inner"><p style="color:var(--red)">Error: ${e.message}</p></div>`});

function sectionShort(s){
  const m=s.match(/SECTION ([A-G]):/);
  if(!m)return s;
  const map={A:'PROBLEM',B:'DATA FUSION',C:'ALGORITHM',D:'DASHBOARD',E:'ENGINEERING',F:'HONESTY',G:'CONCLUSION'};
  return `SECTION ${m[1]} · ${map[m[1]]||''}`;
}

function buildDrawer(){
  $('drawer-list').innerHTML=slides.map((s,i)=>`<div class="drawer-item${i===cur?' active':''}" data-i="${i}"><span class="idx${i===cur?' active':''}">${String(s.number).padStart(2,'0')}</span><span class="ttl">${esc(s.title)}</span></div>`).join('');
  $('drawer-list').querySelectorAll('.drawer-item').forEach(el=>{
    el.onclick=()=>{cur=+el.dataset.i;render(cur);closeDrawer();if(playing)playCur()};
  });
}

function render(idx){
  cur=idx;
  const s=slides[idx];
  $('fill').style.width=`${((idx+1)/slides.length)*100}%`;

  // Update drawer highlights
  document.querySelectorAll('.drawer-item').forEach((el,i)=>{
    el.classList.toggle('active',i===idx);
    el.querySelector('.idx').classList.toggle('active',i===idx);
  });

  const slide=$('slide');

  // ═══ TITLE SLIDE ═══
  if(s.number===1){
    slide.innerHTML=`
    <div class="hero">
      <div class="tag">HAPPIEST HEALTH DIGITAL TWIN CHALLENGE 2026 · PHASE 1</div>
      <h1>CHHAYA</h1>
      <div class="sub">A Diabetes Digital Twin That Shows Its Work</div>
      <div class="desc">One glucose-sensor wear, turned into the patient's shadow, with a scorecard written before the results.</div>
      <div class="team">
        <span class="chip"><span class="ic">🏛</span> Team SynapseX · IIT Kanpur</span>
        <span class="chip"><span class="ic">📦</span> SynapseX_IITK</span>
        <span class="chip"><span class="ic">⚖️</span> MIT License</span>
        <span class="chip"><span class="ic">🧬</span> Python 3.12+ / JAX</span>
        <span class="chip"><span class="ic">📊</span> 9 Bars · 5 Passed · 4 Missed</span>
      </div>
    </div>`;
    return;
  }

  // ═══ CLOSING SLIDE ═══
  if(s.number===67){
    slide.innerHTML=`
    <div class="closing">
      <h1>Chhaya — The Twin That Shows Its Work</h1>
      <div class="sub">One glucose-sensor wear, turned into the patient's shadow, with a scorecard written before the results.</div>
      <div class="team-row">
        <span class="chip"><span class="ic">🏛</span> Team SynapseX · IIT Kanpur</span>
        <span class="chip"><span class="ic">🔬</span> Reproduce: <code style="color:var(--teal)">uv sync && uv run python -m chhaya.dashboard</code></span>
      </div>
    </div>`;
    return;
  }

  // ═══ REGULAR SLIDES ═══
  const img=IMG_MAP[s.number];
  const content=formatContent(s);
  const bodyClass=img?'s-body cols-img':'s-body';

  slide.innerHTML=`
  <div class="slide-inner">
    <div class="sec-tag">
      <span class="dot"></span>
      ${esc(sectionShort(s.section))}
      <span class="num">${s.number} / ${slides.length}</span>
    </div>
    <div class="s-title">${esc(s.title)}</div>
    <div class="accent-line"></div>
    <div class="${bodyClass}">
      <div class="glass">${content}</div>
      ${img?`<div class="img-frame"><img src="${img}" alt="${esc(s.title)}" loading="lazy"></div>`:''}
    </div>
  </div>`;

  // Animate bars if present
  setTimeout(()=>{
    slide.querySelectorAll('.bar-fill').forEach(b=>{b.style.width=b.dataset.w});
  },100);
}

function formatContent(s){
  const raw=s.visual;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let html='';
  let inList=false;

  // Special slide types
  if(s.number===2) return renderSlide2();
  if(s.number===4) return renderSlide4();
  if(s.number===8) return renderSlide8();
  if(s.number===21) return renderSlide21();
  if(s.number===29) return renderSlide29();
  if(s.number===49) return renderSlide49();
  if(s.number===63) return renderSlide63();

  for(const line of lines){
    if(line.endsWith(':')&&!line.startsWith('-')&&!line.startsWith('|')){
      if(inList){html+='</ul>';inList=false}
      html+=`<h3>${esc(line)}</h3>`;
    } else {
      if(!inList){html+='<ul>';inList=true}
      let clean=line.replace(/^[-•*]\s*/,'').replace(/^\d+\.\s*/,'');
      // Highlight patterns
      clean=clean.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
      clean=clean.replace(/\$(.*?)\$/g,'<code style="color:var(--teal);font-family:var(--mono);font-size:13px">$1</code>');
      if(/PASSED|✅/.test(clean)) html+=`<li><span class="badge pass">✓ PASSED</span> ${clean.replace(/PASSED|✅/g,'').replace(/\*\*/g,'')}</li>`;
      else if(/MISSED|❌/.test(clean)) html+=`<li><span class="badge miss">✗ MISSED</span> ${clean.replace(/MISSED|❌/g,'').replace(/\*\*/g,'')}</li>`;
      else html+=`<li>${clean}</li>`;
    }
  }
  if(inList) html+='</ul>';
  return html;
}

// ═══ PLAYBACK ENGINE ═══
function playCur(){
  stopSpeak();clearTimeout(timer);
  render(cur);
  const s=slides[cur];
  $('sub-text').textContent=s.narration;
  $('indicator').classList.remove('paused');

  if(voice&&synth){
    // Chrome bug: cancel before new speak
    synth.cancel();
    setTimeout(()=>{
      utt=new SpeechSynthesisUtterance(s.narration);
      utt.rate=speed;
      const voices=synth.getVoices();
      const pick=voices.find(v=>v.lang.startsWith('en')&&/Natural|Online|Zira|David|Google/.test(v.name))||voices.find(v=>v.lang.startsWith('en'));
      if(pick)utt.voice=pick;
      utt.onend=()=>{if(playing)advance()};
      utt.onerror=()=>{if(playing)fallback(s)};
      synth.speak(utt);
    },50);
  } else fallback(s);
}

function fallback(s){
  const dur=Math.max(10,(s.narration.split(' ').length/(140*speed))*60);
  timer=setTimeout(()=>{if(playing)advance()},dur*1000);
}

function advance(){
  timer=setTimeout(()=>{
    if(cur+1<slides.length){cur++;playCur()}
    else stop();
  },600);
}

function stopSpeak(){synth&&synth.cancel();clearTimeout(timer)}
function play(){playing=true;$('btn-play').textContent='⏸ Pause';$('btn-play').classList.add('active');playCur();startClock()}
function stop(){playing=false;$('btn-play').textContent='▶ Play';$('btn-play').classList.remove('active');stopSpeak();stopClock();$('indicator').classList.add('paused')}
function startClock(){stopClock();clock=setInterval(()=>{elapsed++;$('t-cur').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`},1000)}
function stopClock(){clearInterval(clock)}

function openDrawer(){$('overlay').classList.add('open');$('drawer').classList.add('open')}
function closeDrawer(){$('overlay').classList.remove('open');$('drawer').classList.remove('open')}

// ═══ EVENTS ═══
$('btn-play').onclick=()=>{playing?stop():play()};
$('btn-prev').onclick=()=>{if(cur>0){cur--;render(cur);if(playing)playCur()}};
$('btn-next').onclick=()=>{if(cur+1<slides.length){cur++;render(cur);if(playing)playCur()}};
$('btn-voice').onclick=()=>{voice=!voice;$('btn-voice').textContent=voice?'🔊 Voice':'🔇 Muted';$('btn-voice').classList.toggle('active',!voice);if(playing)playCur()};
$('btn-speed').onclick=()=>{const sp=[1,1.25,1.5];speed=sp[(sp.indexOf(speed)+1)%sp.length];$('btn-speed').textContent=speed+'×';if(playing)playCur()};
$('btn-list').onclick=openDrawer;
$('btn-close').onclick=closeDrawer;
$('overlay').onclick=closeDrawer;
$('btn-fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};

$('track').onclick=e=>{const r=e.target.getBoundingClientRect();const pct=(e.clientX-r.left)/r.width;cur=Math.floor(pct*slides.length);render(cur);if(playing)playCur()};

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='k'){e.preventDefault();playing?stop():play()}
  if(e.key==='ArrowRight'||e.key==='l'){if(cur+1<slides.length){cur++;render(cur);if(playing)playCur()}}
  if(e.key==='ArrowLeft'||e.key==='j'){if(cur>0){cur--;render(cur);if(playing)playCur()}}
  if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key==='Escape')closeDrawer();
});

// Preload voices
if(synth)synth.onvoiceschanged=()=>{};
})();
</script>
