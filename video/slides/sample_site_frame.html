<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Slide: SITE FRAME</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="slide slide-site">
    <div class="slide-header">
      <div class="category-chip">LIVE WEBSITE WALKTHROUGH  MRS. R.</div>
      <div class="team-badge">https://chhaya-digital-twin.vercel.app/</div>
    </div>
    
    <div class="slide-body">
      <div class="site-frame-container">
        <div class="site-browser-bar">
          <div class="site-browser-dots">
            <div class="site-dot" style="background: #e05244;"></div>
            <div class="site-dot" style="background: #e0a33a;"></div>
            <div class="site-dot" style="background: #44b860;"></div>
          </div>
          <div class="site-address-bar">
            <span>🔒 https://chhaya-digital-twin.vercel.app/#p-mrs-r</span>
          </div>
          <div style="margin-left: auto; font-family: var(--font-mono); font-size: 14px; color: var(--accent);">
            Synthetic demo patient
          </div>
        </div>
        <div class="site-viewport">
          <img src="../../docs/images/dashboard-patient.png" alt="Mrs. R. Patient View">
        </div>
      </div>
    </div>

    <div class="caption-bar">
      <div class="caption-text">This is Mrs. R.,
a synthetic demo patient.</div>
    </div>
  </div>
</body>
</html>
